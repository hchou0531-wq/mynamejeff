<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
  <style>
    :root{
      --bg:#0a0714; --bg2:#150a26;
      --magenta:#ff2bd6; --cyan:#34fff0; --purple:#8b3bff; --gold:#ffe94a;
      --ink:#f4eeff; --muted:#9d86c9;
      --common:#8f8fa8; --rare:#34c3ff; --epic:#b34bff; --legendary:#ffcf3d;
    }
    *{box-sizing:border-box;}
    body{margin:0;background:var(--bg);font-family:'VT323',monospace;}
    a{color:var(--cyan);} a:hover{color:var(--magenta);}
    .page{width:1280px;position:relative;overflow:hidden;background:
      radial-gradient(ellipse 900px 600px at 50% 30%, #241242 0%, var(--bg) 65%);}
    .scan{position:absolute;inset:0;pointer-events:none;z-index:5;
      background-image:repeating-linear-gradient(to bottom, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 1px, transparent 2px, transparent 4px);
      mix-blend-mode:overlay;}
    .vignette{position:absolute;inset:0;pointer-events:none;z-index:6;
      background:radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.75) 100%);}

    /* ---- Loading screen ---- */
    .boot{height:780px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
    .grid-floor{position:absolute;left:0;right:0;bottom:0;height:340px;
      background-image:linear-gradient(rgba(139,59,255,0.35) 1px, transparent 1px), linear-gradient(90deg, rgba(139,59,255,0.35) 1px, transparent 1px);
      background-size:56px 56px;
      -webkit-mask-image:linear-gradient(to top, black, transparent);
      mask-image:linear-gradient(to top, black, transparent);
      transform:perspective(320px) rotateX(62deg);
      transform-origin:bottom;}
    .stars{position:absolute;inset:0;}
    .star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:tw 2.6s ease-in-out infinite;}
    @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
    .wordmark{font-family:'Press Start 2P',monospace;font-size:56px;letter-spacing:6px;color:var(--ink);
      text-shadow:0 0 10px var(--magenta), 0 0 30px var(--magenta), 0 0 60px var(--purple);
      position:relative;z-index:2;margin:0;}
    .tagline{font-family:'VT323',monospace;font-size:26px;letter-spacing:6px;color:var(--cyan);
      text-shadow:0 0 8px var(--cyan);margin-top:14px;position:relative;z-index:2;}
    .loadwrap{margin-top:56px;width:520px;position:relative;z-index:2;}
    .loadlabel{display:flex;justify-content:space-between;font-size:20px;color:var(--muted);letter-spacing:3px;margin-bottom:8px;}
    .loadbar{height:22px;border:2px solid var(--cyan);background:rgba(255,255,255,0.03);
      box-shadow:0 0 14px rgba(52,255,240,0.5), inset 0 0 8px rgba(0,0,0,0.6);position:relative;overflow:hidden;}
    .loadfill{position:absolute;inset:0;width:0%;background:linear-gradient(90deg, var(--magenta), var(--purple), var(--cyan));
      animation:fillbar 3.6s ease-in-out infinite alternate;box-shadow:0 0 18px var(--magenta);}
    @keyframes fillbar{0%{width:6%}100%{width:82%}}
    .loadbar::after{content:'';position:absolute;inset:0;
      background-image:repeating-linear-gradient(-45deg, rgba(255,255,255,0.12) 0 6px, transparent 6px 12px);}
    .press{margin-top:40px;font-family:'Press Start 2P',monospace;font-size:14px;letter-spacing:3px;color:var(--gold);
      animation:blink 1.1s steps(1) infinite;position:relative;z-index:2;}
    @keyframes blink{50%{opacity:0}}
    .flavor{margin-top:18px;font-size:17px;color:var(--muted);letter-spacing:2px;position:relative;z-index:2;}

    /* ---- Market GUI ---- */
    .market{padding:44px 64px 64px;position:relative;}
    .hud{display:flex;align-items:center;gap:28px;padding:14px 22px;
      background:linear-gradient(180deg, rgba(139,59,255,0.18), rgba(139,59,255,0.04));
      border:2px solid var(--purple);box-shadow:0 0 18px rgba(139,59,255,0.35);}
    .hud-logo{font-family:'Press Start 2P',monospace;font-size:16px;color:var(--ink);letter-spacing:2px;}
    .hud-tabs{display:flex;gap:10px;flex-grow:1;}
    .hud-tab{font-family:'Press Start 2P',monospace;font-size:11px;letter-spacing:1px;color:var(--muted);
      padding:10px 18px;border:1px solid rgba(157,134,201,0.4);}
    .hud-tab.on{color:var(--bg);background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 12px var(--cyan);}
    .hud-coin{display:flex;align-items:center;gap:8px;font-family:'VT323',monospace;font-size:24px;color:var(--gold);}
    .sec-title{font-family:'Press Start 2P',monospace;font-size:20px;color:var(--ink);letter-spacing:2px;
      margin:38px 0 22px;text-shadow:0 0 10px var(--magenta);}
    .grid{display:grid;grid-template-columns:repeat(3, minmax(0,1fr));gap:24px;}
    .card{background:rgba(21,10,38,0.7);border:2px solid var(--rc,var(--common));padding:18px;
      box-shadow:0 0 16px color-mix(in srgb, var(--rc,var(--common)) 55%, transparent);}
    .card .icon{width:100%;height:130px;display:flex;align-items:center;justify-content:center;
      background:radial-gradient(circle, rgba(255,255,255,0.06), transparent 70%);margin-bottom:14px;}
    .card .name{font-family:'VT323',monospace;font-size:22px;color:var(--ink);letter-spacing:1px;}
    .card .rarity{font-family:'Press Start 2P',monospace;font-size:9px;letter-spacing:1px;color:var(--rc,var(--common));margin:8px 0;}
    .card .price{display:flex;align-items:center;gap:8px;font-family:'VT323',monospace;font-size:22px;color:var(--gold);}
  </style>
</helmet>

<div class="page">
  <div class="boot">
    <div class="stars">
      <div class="star" style="top:12%;left:10%;animation-delay:.2s"></div>
      <div class="star" style="top:22%;left:80%;animation-delay:.8s"></div>
      <div class="star" style="top:8%;left:45%;animation-delay:1.3s"></div>
      <div class="star" style="top:30%;left:65%;animation-delay:.5s"></div>
      <div class="star" style="top:16%;left:25%;animation-delay:1.7s"></div>
      <div class="star" style="top:35%;left:88%;animation-delay:2.1s"></div>
    </div>
    <div class="grid-floor"></div>
    <h1 class="wordmark">ETHEREAL</h1>
    <div class="tagline">Y O U R &nbsp; N E X T &nbsp; D R O P &nbsp; A W A I T S</div>
    <div class="loadwrap">
      <div class="loadlabel"><span>LOADING VAULT</span><span>78%</span></div>
      <div class="loadbar"><div class="loadfill"></div></div>
    </div>
    <div class="flavor">Syncing inventory... verifying trade routes...</div>
    <div class="press">PRESS START TO ENTER MARKET</div>
  </div>
  <div class="scan"></div>
  <div class="vignette"></div>

  <div class="market">
    <div class="hud">
      <div class="hud-logo">ETHEREAL</div>
      <div class="hud-tabs">
        <div class="hud-tab on">SHOP</div>
        <div class="hud-tab">INVENTORY</div>
        <div class="hud-tab">VAULT</div>
      </div>
      <div class="hud-coin">
        <svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="none" stroke="#ffe94a" stroke-width="2"/><path d="M10 6v8M7 8h6M7 12h6" stroke="#ffe94a" stroke-width="1.5"/></svg>
        4,120
      </div>
    </div>
    <div class="sec-title">FEATURED DROPS</div>
    <div class="grid">
      <div class="card" style="--rc:#ffcf3d">
        <div class="icon"><svg width="70" height="70" viewBox="0 0 24 24"><polygon points="12,2 22,9 18,22 6,22 2,9" fill="none" stroke="#ffcf3d" stroke-width="1.5"/></svg></div>
        <div class="name">Void Reaper Blade</div>
        <div class="rarity">LEGENDARY</div>
        <div class="price">
          <svg width="16" height="16" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="none" stroke="#ffe94a" stroke-width="2"/></svg>
          2,400
        </div>
      </div>
      <div class="card" style="--rc:#b34bff">
        <div class="icon"><svg width="70" height="70" viewBox="0 0 24 24"><polygon points="12,2 22,9 18,22 6,22 2,9" fill="none" stroke="#b34bff" stroke-width="1.5"/></svg></div>
        <div class="name">Phantom Hood</div>
        <div class="rarity">EPIC</div>
        <div class="price">
          <svg width="16" height="16" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="none" stroke="#ffe94a" stroke-width="2"/></svg>
          860
        </div>
      </div>
      <div class="card" style="--rc:#34c3ff">
        <div class="icon"><svg width="70" height="70" viewBox="0 0 24 24"><polygon points="12,2 22,9 18,22 6,22 2,9" fill="none" stroke="#34c3ff" stroke-width="1.5"/></svg></div>
        <div class="name">Sky Wisp Wings</div>
        <div class="rarity">RARE</div>
        <div class="price">
          <svg width="16" height="16" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="none" stroke="#ffe94a" stroke-width="2"/></svg>
          310
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
